# Example: terminate TLS in front of Praxis admin (same-origin static + /api).
# Replace server_name, certificate paths, and upstream port as needed.

upstream praxis_admin {
    server 127.0.0.1:18890;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/ssl/certs/admin.example.com.crt;
    ssl_certificate_key /etc/ssl/private/admin.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    # Long-lived model gateway / SSE
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://praxis_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
